name: Atlas 1H
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node observador/run.mjs
      - run: |
          git config user.name "atlas-robo"
          git config user.email "robo@atlas.local"
          git add observador/historico
          git commit -m "robo $(date -u +%Y-%m-%dT%HZ)" || echo sem-mudanca
          git push
